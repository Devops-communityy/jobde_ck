<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:#FFFFFF;border:2px solid #1B2A41;border-radius:6px;padding:16px 22px;display:flex;flex-direction:column;gap:4px;box-shadow:6px 6px 0 #1B2A41}
.lbl{font-family:'JetBrains Mono',monospace;font-size:17px;color:#6B7280;letter-spacing:2px}
.val{font-size:34px;font-weight:700;color:#1B2A41;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val.salary{color:#E4572E}
.note{font-size:19px;color:#4B5563}
.chip{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;color:#1B2A41;background:#FFD166;border:2px solid #1B2A41;border-radius:6px;padding:6px 12px}
</style>
</head>
<body>
<div style="width:1080px;height:1080px;box-sizing:border-box;padding:40px 64px 52px;background:#F6F1E7;color:#1B2A41;font-family:'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;gap:24px;overflow:hidden">

<div style="display:flex;justify-content:space-between;align-items:center">
  <div style="display:flex;align-items:center;gap:22px">
    {{LOGO}}
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:14px">
    <div style="width:44px;height:6px;background:#E4572E"></div>
    <div class="mono" style="font-size:22px;font-weight:700;color:#E4572E;letter-spacing:6px">WE'RE HIRING</div>
  </div>
    </div>
  </div>
  <div class="mono" style="font-size:19px;font-weight:700;color:#F6F1E7;background:#E4572E;border-radius:6px;padding:9px 18px;letter-spacing:2px">NEW JOB ALERT</div>
</div>

<div style="display:flex;flex-direction:column;gap:12px">
  <h1 style="margin:0;font-size:{{ROLE_SIZE}}px;line-height:1.02;font-weight:700;letter-spacing:-1.5px">{{ROLE}}</h1>
  <div style="font-size:34px;font-weight:500;color:#374151">at <span style="font-weight:700;color:#1B2A41;border-bottom:5px solid #FFD166">{{COMPANY}}</span></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px 22px;padding-right:6px">
  <div class="card"><div class="lbl">EXPERIENCE</div><div class="val">{{EXPERIENCE}}</div><div class="note">{{EXPERIENCE_NOTE}}</div></div>
  {{SALARY_CARD}}
  <div class="card"><div class="lbl">LOCATION</div><div class="val">{{CITY}}</div><div class="note">{{LOCATION_NOTE}}</div></div>
  {{FOURTH_CARD}}
</div>

<div style="display:flex;flex-direction:column;gap:12px">
  <div class="lbl">SKILLS</div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">{{CHIPS}}</div>
</div>

<div style="font-size:22px;line-height:1.45;color:#374151"><span style="font-weight:700;color:#1B2A41">Eligible:</span> {{ELIGIBILITY}}</div>

<div style="margin-top:auto;background:#1B2A41;border-radius:6px;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:6px 6px 0 #E4572E">
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="font-size:30px;font-weight:700;color:#FFFFFF">Apply now · Link in description</div>
    <div style="font-size:19px;font-weight:500;color:#C7D0DC">Listed on {{SOURCE}} · Posted {{POSTED}}</div>
  </div>
  <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFD166" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</div>

</div>
</body>
</html>
